version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - dupl
    - errorlint
    - gocritic
    - goconst
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments
        - name: unused-parameter
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: increment-decrement
        - name: context-as-argument
        - name: blank-imports
    dupl:
      threshold: 80
    goconst:
      # JSON keys and column names read better inline than as constants.
      ignore-string-values: ["^(message|code|error|user|tokens|session_id|redirect_url|provider|field|enabled|updated_at|backup_hashes|disabled_at|sign_in)$"]
    misspell:
      locale: US
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Table-driven tests repeat their scaffolding on purpose.
      - path: _test\.go
        linters: [dupl, goconst]
      # Tests need no doc comments.
      - path: _test\.go
        linters: [revive]
        text: "^(exported|package-comments):"

formatters:
  enable:
    - gofmt
    - goimports
