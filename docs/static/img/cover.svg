<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="goauth — authentication for Go">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#121a2f"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="ga-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6b6"/>
      <stop offset="1" stop-color="#1fa2f0"/>
    </linearGradient>
    <linearGradient id="ga-bottom" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c13cf0"/>
      <stop offset="1" stop-color="#6a11cb"/>
    </linearGradient>
    <radialGradient id="ga-badge" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f4fb"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.2" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1fa2f0" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#6a11cb" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ga-shield">
      <path d="M32 2 60 12v22c0 18-12.5 30-28 36C16.5 64 4 52 4 34V12Z"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- Soft grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 70h1280M0 140h1280M0 210h1280M0 280h1280M0 350h1280"/>
    <path d="M160 0v420M320 0v420M480 0v420M640 0v420M800 0v420M960 0v420M1120 0v420"/>
  </g>

  <!-- Accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#ga-top)"/>

  <!-- Logo -->
  <g transform="translate(88 118) scale(2.55)">
    <g clip-path="url(#ga-shield)">
      <rect width="64" height="72" fill="url(#ga-bottom)"/>
      <path d="M0 0h64v16L0 52Z" fill="url(#ga-top)"/>
    </g>
    <circle cx="32" cy="37" r="18" fill="url(#ga-badge)"/>
    <g fill="none" stroke="#00add8" stroke-linecap="round" stroke-linejoin="round" transform="translate(32 37) scale(0.86) translate(-32 -37) translate(5.8 0) skewX(-10)">
      <path d="M16 34h4.5M15 37h5.5M16 40h4.5" stroke-width="1.8"/>
      <path d="M32.6 33.4A5.5 5.5 0 1 0 33.5 37.5H29.6" stroke-width="3.2"/>
      <circle cx="40.6" cy="37" r="5.5" stroke-width="3.2"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="320" y="185" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">goauth</text>
  <text x="324" y="240" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="500">Authentication for Go — free and open source</text>
  <text x="324" y="290" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20">OAuth · OIDC · Passkeys · TOTP MFA · Sessions · JWT</text>

  <!-- Docs chip -->
  <rect x="324" y="320" rx="18" ry="18" width="268" height="36" fill="#1e293b" stroke="#334155"/>
  <circle cx="348" cy="338" r="5" fill="#2ee6b6"/>
  <text x="364" y="343" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">goauth.izetmolla.com</text>
</svg>
